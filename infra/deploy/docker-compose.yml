version: '3.9'
services:
  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    ports:
      - '4000:4000'
    env_file:
      - ../../.env
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
